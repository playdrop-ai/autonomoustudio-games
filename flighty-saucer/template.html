<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1b2a" />
<meta name="description" content="Flighty Saucer — thread a tiny UFO through shifting low-poly monoliths." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Flighty Saucer — Low-Poly 3D Flight</title>
<style>/* APP_STYLE */</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f2764f'/%3E%3Ccircle cx='21' cy='12' r='3.2' fill='%23fff'/%3E%3Ccircle cx='22.3' cy='12' r='1.6' fill='%231b1220'/%3E%3Cpath d='M4 18q7-7 14-3-6 6-14 3z' fill='%23ffd6a5'/%3E%3C/svg%3E" />
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui" aria-live="polite">

  <!-- ===================== HUD ===================== -->
  <div id="hud" class="layer">
    <div class="hud-top">
      <div class="chip" id="bestChip">
        <span class="chip-label">BEST</span>
        <span class="chip-val" id="bestVal">0</span>
      </div>
    </div>
    <div class="score-wrap">
      <div id="score" class="score">0</div>
    </div>
    <div id="biomeToast" class="biome-toast"><span></span></div>
    <div id="milestone" class="milestone"><b></b><i></i></div>
  </div>

  <!-- ===================== GAME OVER ===================== -->
  <div id="over" class="layer center">
    <div class="glass card over-card">
      <div class="ribbon" id="ribbon">NEW BEST</div>
      <div class="medal-wrap">
        <div class="medal" id="medal">
          <svg viewBox="0 0 48 48"><ellipse cx="24" cy="30" rx="19" ry="6.5"/><path d="M13 27a11 11 0 0 1 22 0z"/><circle cx="35" cy="12" r="3.2"/><rect x="33.4" y="14" width="1.8" height="6" rx="0.9"/></svg>
        </div>
        <div class="medal-name" id="medalName">FLEDGLING</div>
      </div>
      <div class="over-scores">
        <div class="os"><div class="os-key">SCORE</div><div class="os-val" id="overScore">0</div></div>
        <div class="divider tall"></div>
        <div class="os"><div class="os-key">BEST</div><div class="os-val alt" id="overBest">0</div></div>
      </div>
      <div class="btn-row">
        <button class="cta small" id="retryBtn"><span class="cta-glow"></span><span class="cta-label">RETRY</span></button>
      </div>
      <div class="hint-small">press <b>R</b> to fly again</div>
    </div>
  </div>

  <!-- ===================== PAUSE ===================== -->
  <div id="pause" class="layer center">
    <div class="glass card pause-card">
      <h2 class="card-title">PAUSED</h2>
      <div class="hint-small">return to PlayDrop to resume</div>
    </div>
  </div>

  <!-- perf readout: press F, or add ?perf=1 -->
  <div id="perf" class="perf"></div>

  <!-- overlays -->
  <div id="nearFlash" class="near-flash"></div>
  <div id="edgeGlow" class="edge-glow"></div>
  <div id="previewGuide" class="preview-guide" aria-hidden="true">
    <div id="previewTapRing" class="preview-tap-ring"></div>
    <img id="previewTapHand" class="preview-tap-hand" src="__PREVIEW_HAND_SRC__" alt="" />
  </div>
</div>

<div id="boot">
  <div class="boot-mark">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/><path d="M12 38q14-14 28-6-12 12-28 6z" fill="currentColor"/><circle cx="41" cy="24" r="5" fill="currentColor"/></svg>
  </div>
  <div class="boot-title">FLIGHTY SAUCER</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-note" id="bootNote">building the world…</div>
</div>

<noscript><div class="noscript">This game needs JavaScript and WebGL.</div></noscript>

<script src="https://assets.playdrop.ai/sdk/playdrop.js"></script>
<!-- APP_SCRIPT -->
</body>
</html>
